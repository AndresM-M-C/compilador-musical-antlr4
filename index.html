<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazilio | Compilador Musical</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #111827;
            --border-color: #1f2937;
            --terminal-bg: #030712;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 20% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Header Bar */
        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .brand-icon i {
            font-size: 1.4rem;
            color: #ffffff;
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Layout */
        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 28px;
            width: 100%;
            max-width: 1200px;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Progress & Loader */
        .progress-container {
            margin-top: 22px;
            display: none;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--input-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Console Log / Status Output */
        .console-box {
            margin-top: 20px;
            background-color: var(--terminal-bg);
            color: #a5b4fc;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
        }

        /* Preview Panel */
        .preview-box {
            width: 100%;
            height: 380px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--input-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .placeholder-text i {
            font-size: 2.8rem;
            color: #374151;
        }

        /* Audio Player */
        .audio-wrapper {
            margin-top: 22px;
            width: 100%;
            display: none;
        }

        .audio-player {
            width: 100%;
            border-radius: 10px;
            outline: none;
        }

        /* Download Section */
        .downloads-container {
            margin-top: 20px;
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn-download {
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            border-color: var(--primary);
            color: #ffffff;
            background-color: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        @media (min-width: 650px) {
            .downloads-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 900px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-compact-disc"></i>
            </div>
            <div>
                <h1>Bazilio</h1>
            </div>
            <span class="badge">Compilador Musical</span>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- Editor Column -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-sliders"></i> Escribe tu Música
            </div>

            <div class="form-group">
                <label for="archivo">Título de tu canción:</label>
                <input type="text" id="archivo" placeholder="ej. MiMelodia">
            </div>

            <div class="form-group">
                <label for="codigo">Notas musicales:</label>
                <textarea id="codigo" placeholder="Escribe tus notas aquí (ej. C D E G)"></textarea>
            </div>
            
            <button id="btn-ejecutar" class="btn-submit" onclick="ejecutar()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Crear música y partitura
            </button>

            <!-- Progress Bar -->
            <div class="progress-container" id="progress-container">
                <div class="progress-header">
                    <span id="progress-status">Preparando...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Console Log -->
            <div class="console-box" id="salida">Listo para crear tu música...</div>
        </div>

        <!-- Preview Column -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-headphones"></i> Escucha y Visualiza
            </div>

            <div class="preview-box" id="preview-box">
                <div class="placeholder-text">
                    <i class="fa-solid fa-file-audio"></i>
                    <p>Aquí aparecerá la partitura y el reproductor de audio una vez que crees tu música.</p>
                </div>
            </div>

            <!-- Audio Player -->
            <div class="audio-wrapper" id="audio-wrapper">
                <label style="margin-bottom: 8px;">Escuchar Canción (MP3):</label>
                <audio id="audio-player" class="audio-player" controls></audio>
            </div>

            <!-- Download Buttons -->
            <div class="downloads-container" id="downloads-container">
                <a id="dl-pdf" class="btn-download" download target="_blank">
                    <i class="fa-solid fa-file-pdf" style="color: #ef4444;"></i> PDF
                </a>
                <a id="dl-mp3" class="btn-download" download target="_blank">
                    <i class="fa-solid fa-file-audio" style="color: #10b981;"></i> MP3
                </a>
                <a id="dl-wav" class="btn-download" download target="_blank">
                    <i class="fa-solid fa-file-waveform" style="color: #3b82f6;"></i> WAV
                </a>
                <a id="dl-midi" class="btn-download" download target="_blank">
                    <i class="fa-solid fa-sliders" style="color: #f59e0b;"></i> MIDI
                </a>
            </div>
        </div>
    </div>

    <script>
        let progressInterval;

        function iniciarCarga() {
            const btn = document.getElementById('btn-ejecutar');
            const progressContainer = document.getElementById('progress-container');
            const progressFill = document.getElementById('progress-fill');
            const progressStatus = document.getElementById('progress-status');
            const progressPercent = document.getElementById('progress-percent');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Creando magia...`;
            progressContainer.style.display = 'block';
            
            let percent = 0;
            progressFill.style.width = '0%';
            
            progressInterval = setInterval(() => {
                if (percent < 20) {
                    percent += 2;
                    progressStatus.textContent = "Leyendo tus notas musicales...";
                } else if (percent < 50) {
                    percent += 1;
                    progressStatus.textContent = "Diseñando tu partitura en PDF...";
                } else if (percent < 90) {
                    percent += 1;
                    progressStatus.textContent = "Generando audio y efectos (puede tardar un momento)...";
                }
                progressFill.style.width = percent + '%';
                progressPercent.textContent = percent + '%';
            }, 1000);
        }

        function finalizarCarga(exito = true) {
            clearInterval(progressInterval);
            const btn = document.getElementById('btn-ejecutar');
            const progressFill = document.getElementById('progress-fill');
            const progressPercent = document.getElementById('progress-percent');
            const progressStatus = document.getElementById('progress-status');

            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            progressStatus.textContent = exito ? "¡Listo!" : "Hubo un detalle en el proceso";

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Crear música y partitura`;
        }

        async function ejecutar() {
            let archivo = document.getElementById('archivo').value.trim() || 'MiCancion';
            let notas = document.getElementById('codigo').value.trim();
            const salida = document.getElementById('salida');

            if (!notas) {
                salida.textContent = "[Aviso] Por favor escribe algunas notas musicales antes de continuar.";
                return;
            }

            iniciarCarga();
            salida.textContent = "[Info] Procesando tu música en el servidor, por favor espera...";

            try {
                let resp = await fetch('/ejecutar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ archivo: archivo, notas: notas })
                });

                if (!resp.ok) {
                    throw new Error(`Error en servidor: ${resp.status}`);
                }

                let res = await resp.json();
                salida.textContent = res.resultado;

                const previewBox = document.getElementById('preview-box');
                const audioWrapper = document.getElementById('audio-wrapper');
                const audioPlayer = document.getElementById('audio-player');
                const downloadsContainer = document.getElementById('downloads-container');

                if (res.ruta_pdf) {
                    previewBox.innerHTML = `<iframe src="/archivo?ruta=${encodeURIComponent(res.ruta_pdf)}#view=FitH&toolbar=0&navpanes=0" class="pdf-viewer"></iframe>`;
                    document.getElementById('dl-pdf').href = `/archivo?ruta=${encodeURIComponent(res.ruta_pdf)}`;
                } else {
                    previewBox.innerHTML = `<div class="placeholder-text"><i class="fa-solid fa-circle-exclamation"></i><p>No se pudo mostrar la partitura.</p></div>`;
                }

                if (res.ruta_mp3) {
                    audioPlayer.src = `/archivo?ruta=${encodeURIComponent(res.ruta_mp3)}&t=${Date.now()}`;
                    audioWrapper.style.display = 'block';
                    document.getElementById('dl-mp3').href = `/archivo?ruta=${encodeURIComponent(res.ruta_mp3)}`;
                    
                    let rutaWav = res.ruta_mp3.replace('.mp3', '.wav');
                    document.getElementById('dl-wav').href = `/archivo?ruta=${encodeURIComponent(rutaWav)}`;

                    let rutaMidi = res.ruta_mp3.replace('.mp3', '.midi');
                    document.getElementById('dl-midi').href = `/archivo?ruta=${encodeURIComponent(rutaMidi)}`;
                    
                    downloadsContainer.style.display = 'grid';
                } else {
                    audioWrapper.style.display = 'none';
                    downloadsContainer.style.display = 'none';
                }

                finalizarCarga(true);

            } catch (e) {
                salida.textContent = "[Aviso de Conexión] El servidor tardó un poco más de lo habitual debido a los recursos gratuitos. Vuelve a intentarlo en un momento.";
                finalizarCarga(false);
            }
        }
    </script>
</body>
</html>
